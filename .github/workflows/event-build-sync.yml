name: Event branch deterministic build sync
on:
  push:
    branches: ['event/uds-20261030']
permissions:
  contents: write
jobs:
  sync-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: event/uds-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py
      - name: Commit deterministic generated files
        run: |
          if git diff --quiet -- google-apps-script/Build.gs google-apps-script/DOMUS_PRODUCTION_BUNDLE.gs google-apps-script/DOMUS_STAGING_BUNDLE.gs google-apps-script/Index.html release-manifest.json; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/Build.gs google-apps-script/DOMUS_PRODUCTION_BUNDLE.gs google-apps-script/DOMUS_STAGING_BUNDLE.gs google-apps-script/Index.html release-manifest.json
          git commit -m "build: regenerate deterministic event release artifacts"
          git push origin HEAD:event/uds-20261030
