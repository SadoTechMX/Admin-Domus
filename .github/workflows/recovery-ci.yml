name: Recovery regressions (isolated fixtures)
on:
  pull_request:
  push:
    branches: ['repair/qa-20261030', 'repair/reconcile-pr18-main-20261105']
permissions:
  contents: read
jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py --check
      - run: node tests/recovery_regressions.js
      - run: node tests/client_recovery_regressions.js
      - run: node tests/reconciliation_regressions.js
      - run: node tests/review_regressions.js
      - run: node tests/reload_rejection_regressions.js
      - run: node tests/master_transport_regressions.js
      - run: node tests/legacy_cutover_regressions.js
      - run: node tests/activity_schema_regressions.js
      - run: node tests/external_registration_regressions.js
      - run: node tests/receipt_delivery_regressions.js
      - run: node tests/transfer_review_regressions.js
      - run: node tests/outbox_quarantine_regressions.js
      - run: node tests/test_event_selection.mjs
      - run: node tests/test_access_channel.mjs
      - run: python tests/test_hotfix_v13.py
      - run: python tests/test_kds_v14.py
      - run: python tests/bridge_recovery_regressions.py
      - run: python tests/test_write_guardrails.py
      - run: python tests/test_staging_harness_safety.py
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_local_regressions.js
      - run: node tests/browser_outbox_concurrency.js
      - run: node tests/browser_transfer_review.js
      - run: node tests/browser_outbox_review.js
