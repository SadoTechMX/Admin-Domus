name: Recovery regressions (isolated fixtures)
on:
  pull_request:
  push:
    branches: ['repair/qa-20261030', 'repair/reconcile-pr18-main-20261105']
permissions:
  contents: read
jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py --check
      - run: node tests/recovery_regressions.js
      - run: node tests/client_recovery_regressions.js
      - run: node tests/reconciliation_regressions.js
      - run: node tests/station_routing_regressions.js
      - run: node tests/review_regressions.js
      - run: node tests/reload_rejection_regressions.js
      - run: node tests/master_transport_regressions.js
      - run: node tests/legacy_cutover_regressions.js
      - run: node tests/activity_schema_regressions.js
      - run: node tests/external_registration_regressions.js
      - run: node tests/receipt_delivery_regressions.js
      - run: node tests/transfer_review_regressions.js
      - run: node tests/transfer_resolution_proposal_regressions.js
      - run: node tests/transfer_cancellation_regressions.js
      - run: node tests/transfer_cancellation_transport.js
      - run: node tests/existing_payment_link_regressions.js
      - run: node tests/existing_payment_link_transport.js
      - run: node tests/outbox_quarantine_regressions.js
      - run: node tests/outbox_release_regressions.js
      - run: node tests/operating_period_regressions.js
      - run: node tests/mixed_payment_regressions.js
      - run: node tests/print_token_removal_regressions.js
      - run: node tests/journey_context_regressions.js
      - run: node tests/legacy_journey_activation_regressions.js
      - run: node tests/staging_opening_isolation_regressions.js
      - run: node tests/staging_prepared_output_regressions.js
      - run: node tests/journey_operations_regressions.js
      - run: node tests/history_boundary_regressions.js
      - run: node tests/journal_integrity_regressions.js
      - run: node tests/request_id_regressions.js
      - run: node tests/ledger_identity_regressions.js
      - run: node tests/journey_transport_regressions.js
      - run: node tests/test_event_selection.mjs
      - run: node tests/test_access_channel.mjs
      - run: python tests/test_hotfix_v13.py
      - run: python tests/test_kds_v14.py
      - run: python tests/bridge_recovery_regressions.py
      - run: python tests/test_write_guardrails.py
      - run: python tests/test_staging_harness_safety.py
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_local_regressions.js
      - run: node tests/browser_station_routing.js
      - run: node tests/browser_outbox_concurrency.js
      - run: node tests/browser_transfer_review.js
      - run: node tests/browser_transfer_cancellation.js
      - run: node tests/browser_existing_payment_link.js
      - run: node tests/browser_outbox_review.js
      - run: node tests/browser_operating_recovery.js
      - run: node tests/browser_journey_operations.js
      - run: DOMUS_TEST_HISTORY=1 node tests/browser_journey_operations.js
      - run: node tests/browser_mixed_payment.js
      - run: node tests/browser_print_token_removal.js
